# Local (Windows, no Docker available on this machine) adaptation of my.cnf.
# Uses the same InnoDB/utf8mb4/general_log settings as the Docker variant.
[mysqld]
basedir = C:/Users/Administrator/source/check/mysql-8.4.6-winx64
datadir = C:/Users/Administrator/source/check/my-mysql/data
port = 3307
mysqlx = 0
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci
general_log = 1
general_log_file = C:/Users/Administrator/source/check/my-mysql/general.log
log_output = FILE

[client]
port = 3307
default-character-set = utf8mb4

[mysql]
default-character-set = utf8mb4
